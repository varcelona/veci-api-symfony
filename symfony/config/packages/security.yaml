security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email
        merchant_user_provider:
            entity:
                class: App\Entity\Merchant
                property: email
        customer_user_provider:
            entity:
                class: App\Entity\Customer
                property: email
        api_user_provider:
            # chain:
            #     providers: ['merchant_user_provider', 'customer_user_provider']
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        # Endpoint de login por JSON (email/password) -> devuelve JWT (Lexik)
        api_login:
            pattern: ^/auth/login
            stateless: true
            json_login:
                check_path: /auth/login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
                provider: api_user_provider

        # Refresh token -> devuelve un nuevo JWT
        refresh:
            pattern: ^/auth/token/refresh
            stateless: true
            security: false

        # GraphQL/API protegida por JWT
        api:
            pattern: ^/api
            stateless: true
            jwt: ~   # authenticator de Lexik
            provider: api_user_provider

        main:
            pattern: ^/admin/
            lazy: true
            provider: app_user_provider
            user_checker: security.user_checker.chain.main

            login_throttling:
                max_attempts: 3

            remember_me:
                secret:   '%kernel.secret%' # required
                lifetime: 604800 # 1 week in seconds
                always_remember_me: true

            form_login:
                # "app_login" is the name of the route created previously
                enable_csrf: true
                login_path: backend_login
                check_path: backend_login
                use_referer: true
                # default_target_path: app_after_login
                username_parameter: login_user_form[email]
                password_parameter: login_user_form[password]
                remember_me: true

            logout:
                path: backend_logout

            custom_authenticator: App\Security\LoginAuthenticator
            entry_point: form_login

    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used
    access_control:
        # - { path: ^/$, roles: PUBLIC_ACCESS } # Allows accessing the Swagger UI
        # - { path: ^/api, roles: PUBLIC_ACCESS } # Allows accessing API documentations and Swagger UI docs
        # - { path: ^/auth, roles: PUBLIC_ACCESS }
        - { path: ^/auth/login, roles: PUBLIC_ACCESS }
        - { path: ^/auth/token/refresh, roles: PUBLIC_ACCESS }
        - { path: ^/api/graphql, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
        # - { path: ^/, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/admin/login, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_ADMIN }

    role_hierarchy:
        ROLE_ADMIN:
            - ROLE_MERCHANT
            - MANAGE_ALL_USERS
            - MANAGE_SELF

        ROLE_MERCHANT:
            - MANAGE_SELF_LIMITED
            - MANAGE_CUSTOMERS

        ROLE_CUSTOMER:
            - MANAGE_CUSTOMER_SELF
when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
