# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.mailer_sender_email: '%env(MAILER_SENDER_EMAIL)%'
    app.mailer_sender_name: '%env(MAILER_SENDER_NAME)%'
    app.index: '%env(bool:APP_INDEX)%'
    app.site_domain: '%env(SITE_DOMAIN)%'
    app.site_admin_host: '%env(SITE_ADMIN_HOST)%'
    app.front_verify_url: '%env(APP_VERIFY_URL)%'
    app.front_reset_password_url: '%env(APP_PASSWORD_RESET_URL)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    App\State\UserPasswordHasher:
        bind:
            $processor: '@api_platform.doctrine.orm.state.persist_processor'

    App\Service\AuthCodeMailer:
        arguments:
            $mailer: '@mailer.mailer'

    # GraphQL custom input type for "register" mutation
    App\GraphQL\Type\UserProfileInputType:
        tags: ['api_platform.graphql.type']

    App\GraphQL\Resolver\RegisterCustomerResolver:
        arguments:
            $em: '@doctrine.orm.entity_manager'
            $passwordHasher: '@security.password_hasher'

    App\Menu\Backend:
        arguments: ["@knp_menu.factory"]
        tags:
            - { name: knp_menu.menu_builder, method: createBackendAdminMenu, alias: backendAdminMenu }

    App\Service\RefreshTokenGenerator:
        arguments:
            $refreshTokenTtl: '%gesdinet_jwt_refresh_token.ttl%'

    App\Resolver\ConfirmPasswordResetResolver:
        tags:
        - { name: api_platform.graphql.mutation_resolver }
